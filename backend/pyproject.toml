[project]
name = "edusupervision-backend"
version = "0.1.0"
description = "AI-Powered Teacher Training, Evaluation & Educational Supervision Platform Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "sqlalchemy[asyncio]==2.0.30",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "pgvector==0.3.0",
    "celery[redis]==5.4.0",
    "redis==5.0.4",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.1.2",
    "python-multipart==0.0.9",
    "slowapi==0.1.9",
    "google-generativeai==0.5.2",
    "pymupdf==1.24.2",
    "python-docx==1.1.0",
    "python-magic==0.4.27",
    "jinja2==3.1.3",
    "psycopg2-binary==2.9.9",
    "datasketch==1.6.4",
    "boto3==1.34.100",
]

[tool.ruff]
line-length = 88
target-version = "py311"
