services:
  # ── PostgreSQL with pgvector ──────────────────────────────────────────────
  - type: pserv
    name: edusupervision-db
    plan: free
    env: docker
    dockerfilePath: ./render-postgres/Dockerfile
    disk:
      name: pgdata
      mountPath: /var/lib/postgresql/data
      sizeGB: 1

  # ── Redis ─────────────────────────────────────────────────────────────────
  - type: redis
    name: edusupervision-redis
    plan: free
    ipAllowList: []

  # ── FastAPI Backend Web Service ────────────────────────────────────────────
  - type: web
    name: edusupervision-api
    plan: free
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: edusupervision-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: edusupervision-redis
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: SERVICE_KEY
        generateValue: true

databases:
  - name: edusupervision-db
    plan: free
    databaseName: edusupervision
    user: edusupervision_user
